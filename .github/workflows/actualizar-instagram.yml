name: Actualizar datos de Instagram

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-instagram
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Pedir datos a Instagram
        run: node update-instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Guardar cambios
        run: |
          git config user.name "portento-bot"
          git config user.email "portento-bot@users.noreply.github.com"
          git add stats.json history.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos de Instagram $(date -u +%F)"
            git push
          fi

      - name: Preparar la web
        run: |
          mkdir -p _web
          cp index.html stats.json *.jpg _web/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _web

      - name: Publicar la web
        id: deploy
        uses: actions/deploy-pages@v4
